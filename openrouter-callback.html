<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>BudgetBull</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111213; color: #f5f5f5;
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center; }
  a { display: inline-block; margin-top: 16px; padding: 12px 24px; border-radius: 999px; background: #f5f5f5;
      color: #121213; text-decoration: none; font-weight: 500; }
</style>
</head>
<body>
<main>
  <p>Возвращаемся в BudgetBull…</p>
  <a id="open" href="#">Открыть BudgetBull</a>
</main>
<script>
  // OpenRouter sends the browser here with ?code=…; the app's sign-in sheet is
  // waiting for its own URL scheme, so pass the code straight on.
  var code = new URLSearchParams(location.search).get('code') || '';
  var target = 'com.anonymous.FinanceAppVitalii://openrouter-auth?code=' + encodeURIComponent(code);
  document.getElementById('open').href = target;
  location.replace(target);
</script>
</body>
</html>
